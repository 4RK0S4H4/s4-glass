<style>
  .sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-bar);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
  .sw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .sw{width:40px;height:40px;flex:none;border-radius:50%;padding:0;border:3px solid var(--bg);background:var(--c);box-shadow:0 0 0 1px var(--border2);cursor:pointer}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--text)}
  .custom{position:relative;flex:none;min-height:40px;border-radius:999px}
  .custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
  .custom .dot{width:16px;height:16px;border-radius:50%;background:conic-gradient(#e11d48,#f59e0b,#16a34a,#0891b2,#4f46e5,#c026d3,#e11d48)}
  .now{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .now .nm{font-weight:600} .now .hex{color:var(--text2)}
  .ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-left:auto}
  .ctl .grp{display:flex;align-items:center;gap:8px}
  .ctl .lbl{font-size:var(--fs-xs);font-weight:600;color:var(--text3)}
  .btn.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .fallback{flex-basis:100%;display:none} .fallback.show{display:block} .fallback .input{width:100%}
  .mock{min-width:0}
  @media (max-width:760px){
    .sbar{gap:8px 10px;padding:8px 16px}
    #swatches{flex-wrap:nowrap;overflow-x:auto;flex:1 1 100%;padding:2px;margin:-2px;scrollbar-width:none}
    .custom .lbl-long,.ctl .lbl,.long{display:none} .custom{padding:0 12px} .ctl{margin-left:0}
  }
</style>
<div class="sbar" role="region" aria-label="Color sampler controls">
  <div class="sw-row" id="swatches" role="group" aria-label="Accent colors"><label class="btn custom" title="Pick any color"><span class="dot"></span><span class="lbl-long">Custom</span><input id="custom" type="color" value="#4f46e5" aria-label="Custom accent color"></label></div>
  <div class="now"><span class="nm" id="nm"></span><span class="hex" id="hex"></span><span class="badge ok" id="contrast"></span>
    <button class="btn sm" id="copy" type="button"><span id="copyLbl">Copy</span></button></div>
  <div class="ctl">
    <div class="grp"><span class="lbl">Theme</span><div class="seg" id="theme" role="group" aria-label="Theme"><button type="button" data-v="light">Light</button><button type="button" data-v="dark">Dark</button><button type="button" data-v="system">System</button></div></div>
    <div class="grp"><span class="lbl">Neutrals</span><div class="seg" id="neutrals" role="group" aria-label="Neutrals"><button type="button" data-v="tinted">Tinted</button><button type="button" data-v="mono">Mono<span class="long">chrome</span></button></div></div>
  </div>
  <div class="fallback" id="fallback"><input class="input" id="fbText" readonly aria-label="Accent values to copy"></div>
</div>
<div class="mock"><!-- the app's real main screen goes here --></div>
<script>
/* 6-8 swatches that fit the request. a = --accent, b = --accent-2, l = --accent-light */
const SWATCHES = [
  {name:"Indigo",  a:"#4f46e5", b:"#6d28d9", l:"#a5b4fc"},
  {name:"Emerald", a:"#047857", b:"#0f766e", l:"#6ee7b7"},
  {name:"Teal",    a:"#0f766e", b:"#155e75", l:"#5eead4"},
  {name:"Blue",    a:"#1d64d8", b:"#3b3fc4", l:"#93c5fd"},
  {name:"Violet",  a:"#7c3aed", b:"#a21caf", l:"#c4b5fd"},
  {name:"Orange",  a:"#c2410c", b:"#be123c", l:"#fdba74"},
  {name:"Red",     a:"#c81e3a", b:"#9f1239", l:"#fda4af"},
  {name:"Pink",    a:"#be185d", b:"#9d174d", l:"#f9a8d4"}
];
const PICK = {name:"Emerald", neutrals:"tinted", theme:"system"};   /* your recommendation; neutrals "tinted" or "mono" */
const KEY = "s4-sampler:" + document.title;
const $ = id => document.getElementById(id), root = document.documentElement;
const hexRgb = h => { h = h.replace("#",""); return [0,2,4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const lum = rgb => { const [r,g,b] = rgb.map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126*r + .7152*g + .0722*b; };
const toHsl = hex => { let [r,g,b] = hexRgb(hex).map(v => v / 255); const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
  let h = 0, l = (mx + mn) / 2, s = d ? d / (1 - Math.abs(2*l - 1)) : 0;
  if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l]; };
const fromHsl = (h, s, l) => { const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return "#" + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2,"0")).join(""); };
const derive = hex => { const [h,s,l] = toHsl(hex);   /* accent-2: ~28deg round and a bit darker; accent-light: light tint */
  return {name:"Custom", a:hex, b:fromHsl((h + 28) % 360, s, Math.max(l - .08, .16)), l:fromHsl(h, Math.min(s, .9), .8)}; };
let state = {sw: SWATCHES.find(s => s.name === PICK.name) || SWATCHES[0], neutrals: PICK.neutrals, theme: PICK.theme};
try { const saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.sw) state = saved; } catch (e) {}
SWATCHES.forEach(s => {
  const b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.style.setProperty("--c", s.a);
  b.setAttribute("aria-label", s.name + (s.name === PICK.name ? " (my pick)" : "")); b.title = b.getAttribute("aria-label");
  b.onclick = () => { state.sw = s; apply(); };
  $("swatches").insertBefore(b, $("swatches").querySelector(".custom"));
});
$("custom").addEventListener("input", e => { state.sw = derive(e.target.value); apply(); });
$("theme").onclick = e => { const v = e.target.closest("button")?.dataset.v; if (v) { state.theme = v; apply(); } };
$("neutrals").onclick = e => { const v = e.target.closest("button")?.dataset.v; if (v) { state.neutrals = v; apply(); } };
$("copy").onclick = () => {
  const s = state.sw, text = `--accent:${s.a}; --accent-2:${s.b}; --accent-light:${s.l};`;
  const done = () => { $("copyLbl").textContent = "Copied"; $("copy").classList.add("done"); setTimeout(() => { $("copyLbl").textContent = "Copy"; $("copy").classList.remove("done"); }, 1400); };
  const fallback = () => { $("fbText").value = text; $("fallback").classList.add("show"); $("fbText").select(); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
};
document.querySelector(".mock").addEventListener("click", e => {   /* the mock's filters and nav respond, so it feels real */
  const b = e.target.closest(".seg button, .nav .item"); if (!b) return;
  const cls = b.matches(".nav .item") ? "active" : "on";
  b.parentElement.querySelectorAll(":scope > ." + cls).forEach(x => x.classList.remove(cls)); b.classList.add(cls);
});
function apply() {
  const s = state.sw;
  root.style.setProperty("--accent", s.a); root.style.setProperty("--accent-2", s.b); root.style.setProperty("--accent-light", s.l);
  if (state.theme === "system") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", state.theme);
  if (state.neutrals === "mono") root.setAttribute("data-neutrals", "mono"); else root.removeAttribute("data-neutrals");
  $("nm").textContent = s.name + (s.name === PICK.name ? " (my pick)" : ""); $("hex").textContent = s.a; $("custom").value = s.a;
  const c = 1.05 / (lum(hexRgb(s.a)) + .05), cb = $("contrast");
  cb.textContent = `White text ${c.toFixed(1)}:1` + (c < 4.5 ? ", too low" : ""); cb.className = "badge " + (c < 4.5 ? "bad" : "ok");
  $("swatches").querySelectorAll(".sw").forEach((b, i) => b.setAttribute("aria-pressed", SWATCHES[i].a === s.a));
  $("theme").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === state.theme));
  $("neutrals").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === state.neutrals));
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
apply();
</script>
